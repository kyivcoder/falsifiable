<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; --text: #1f2328; --muted: #59636e; --line: #d0d7de; --error: #d1242f; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #e6edf3; --muted: #9198a1; --line: #3d444d; --error: #f85149; --bg: #0d1117; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    input { flex: 1; min-width: 0; padding: 0.5rem; font: inherit; }
    button { padding: 0.5rem 1rem; font: inherit; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-bottom: 1px solid var(--line); padding: 0.75rem 0; overflow-wrap: anywhere; }
    time, #status { color: var(--muted); font-size: 0.875rem; }
    time { display: block; }
    #error { color: var(--error); min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Notes</h1>
    <form id="add-note">
      <label for="note-text">New note</label>
      <input id="note-text" name="text" maxlength="280" required autocomplete="off" placeholder="Write a note">
      <button type="submit">Add note</button>
    </form>
    <p id="error" role="alert"></p>
    <p id="status">Loading notes…</p>
    <ul id="notes"></ul>
  </main>
  <script type="module">
    const form = document.querySelector('#add-note');
    const input = document.querySelector('#note-text');
    const button = form.querySelector('button');
    const list = document.querySelector('#notes');
    const status = document.querySelector('#status');
    const error = document.querySelector('#error');

    function item(note) {
      const li = document.createElement('li');
      const text = document.createElement('div');
      text.textContent = note.text;
      const time = document.createElement('time');
      time.dateTime = note.createdAt;
      time.textContent = new Date(note.createdAt).toLocaleString();
      li.append(text, time);
      return li;
    }

    async function load() {
      const response = await fetch('/api/notes');
      if (!response.ok) throw new Error(`GET /api/notes answered ${response.status}`);
      const { notes } = await response.json();
      list.replaceChildren(...notes.map(item));
      status.textContent = 'No notes yet.';
      status.hidden = notes.length > 0;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text: input.value }),
        });
        const body = await response.json();
        if (!response.ok) {
          error.textContent = body.error;
          return;
        }
        input.value = '';
        await load();
      } catch {
        error.textContent = 'The note could not be saved. Check that the app is running and try again.';
      } finally {
        button.disabled = false;
        input.focus();
      }
    });

    load().catch(() => {
      status.hidden = true;
      error.textContent = 'The notes could not be loaded. Reload the page to try again.';
    });
  </script>
</body>
</html>
